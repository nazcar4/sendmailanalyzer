# SendmailAnalyzer 10 - dedicated HTTPS reporting-site example.
#
# The Debian package can generate this layout automatically.
# Replace example.test, certificate paths and the documentation LAN below
# when using this file manually.
#
# Required Apache modules:
#   ssl rewrite proxy proxy_http headers auth_basic authn_file authz_user

<VirtualHost *:80>
    ServerName reports.example.test

    RewriteEngine On
    RewriteRule ^ https://reports.example.test%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/reports.example.test-error.log
    CustomLog ${APACHE_LOG_DIR}/reports.example.test-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName reports.example.test

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/example.test/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.test/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:9080/
    ProxyPassReverse / http://127.0.0.1:9080/

    <Location />
        AuthType Basic
        AuthName "SendmailAnalyzer - Protected access"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/auth/sendmailanalyzer.htpasswd

        <RequireAny>
            Require ip 127.0.0.1 ::1 192.0.2.0/24
            Require user sendmailreports
        </RequireAny>
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/reports.example.test-error.log
    CustomLog ${APACHE_LOG_DIR}/reports.example.test-access.log combined

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
</VirtualHost>
