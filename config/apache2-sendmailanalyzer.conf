# SendmailAnalyzer 10 - Apache reverse proxy example for a fresh installation.
# Existing SendmailAnalyzer 9.4 installations are migrated in-place and retain
# their previous report URL and Require access rules when possible.
# Required modules: proxy proxy_http headers alias

RedirectMatch 301 ^/reports$ /reports/
ProxyPass        /reports/ http://127.0.0.1:9080/
ProxyPassReverse /reports/ http://127.0.0.1:9080/

<Location /reports/>
    Require local
    RequestHeader set X-Forwarded-Prefix "/reports"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "SAMEORIGIN"
</Location>
