# SendmailAnalyzer 10.0.16 - main configuration
# Format: PARAMETER value
# Lines beginning with # are comments.
# After changing this file, validate it with:
#   /usr/bin/sa10_selftest --config /etc/sendmailanalyzer.conf
# Restart only the affected SendmailAnalyzer service if required.

# CONFIG_DIR
# Optional drop-in directory for site-local overrides. Files ending in .conf
# are loaded in lexical order after this main file. The package never creates,
# replaces or removes site-local files inside this directory.
CONFIG_DIR /etc/sendmailanalyzer.d

# HEADER_ROUTE / HEADER_IGNORE
# Optional repeated directives for sites that rename milter-generated headers.
# HEADER_ROUTE disambiguates a rewritten destination header to an engine. This
# is especially useful when more than one engine emits X-Spam-Status.
# HEADER_IGNORE marks a site-local informational header as intentionally ignored.
# Keep deployment-specific header names in CONFIG_DIR, not in the public file.
# Examples:
# HEADER_ROUTE X-Custom-Rspamd-Status rspamd
# HEADER_ROUTE X-Custom-SpamAssassin-Status spamassassin
# HEADER_ROUTE X-Custom-Virus-Status clamav
# HEADER_IGNORE X-Custom-Informational

# LOG_FILE
# Primary mail log followed by the collector in real time.
# On Debian systems using rsyslog/Postfix this is normally /var/log/mail.log.
LOG_FILE /var/log/mail.log

# RSPAMD_LOG_FILE
# Native Rspamd log. It provides action, score, symbols, forced_action,
# settings_id, timing and other details that may not appear in mail.log.
# If the file does not exist, sa10_selftest treats it as an optional source.
# The sendmailanalyzer service account must have read access when it is used.
RSPAMD_LOG_FILE /var/log/rspamd/rspamd.log

# DB_FILE
# SQLite database containing messages, events, recipients and collector state.
# Do not share this database between independent SendmailAnalyzer instances.
DB_FILE /var/lib/sendmailanalyzer/sendmailanalyzer.sqlite3

# STATE_FILE
# Reserved for compatibility with early v10 prototypes.
# Current inode/offset state is stored in SQLite (collector_state).
# This file is not currently written and normally should not be changed.
STATE_FILE /var/lib/sendmailanalyzer/collector.state

# LEGACY_DATA_DIR
# SendmailAnalyzer 9.4 data directory used only by explicit/manual legacy
# migration and import tools. The normal v10 collector never writes here.
LEGACY_DATA_DIR /usr/local/sendmailanalyzer/data

# LOCAL_DOMAINS
# Comma-separated local domains, without spaces.
# They are used to classify traffic as inbound, outbound, internal or relay.
# On a fresh installation replace localhost with the real local domains.
LOCAL_DOMAINS localhost

# HOSTNAME
# Optional logical host name assigned to native events.
# When omitted, the system host name is used.
# HOSTNAME mail.example.net

# BIND_HOST
# Address used by the PSGI web service. Keep 127.0.0.1 when Apache/Nginx is
# used as a reverse proxy so Plack is not exposed directly to the network.
BIND_HOST 127.0.0.1

# BIND_PORT
# Local TCP port used by the PSGI web interface.
BIND_PORT 9080

# RAW_RETENTION_DAYS
# Number of days for which the original raw log line is retained per event.
# Expiration removes only events.raw; structured historical data is preserved.
# Set to 0 to disable automatic raw-text pruning.
RAW_RETENTION_DAYS 31

# WEB_PAGE_SIZE
# Default number of rows shown in web listings.
# The API also enforces safety limits on large queries.
WEB_PAGE_SIZE 100

# MEMORY_MESSAGE_LIMIT
# Approximate maximum number of messages kept in the classifier RAM cache.
# Older messages are evicted when this limit is exceeded and can be hydrated
# again from SQLite if later events refer to them.
MEMORY_MESSAGE_LIMIT 10000
